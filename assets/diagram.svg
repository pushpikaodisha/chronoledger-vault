<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="100%" height="480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="100%" stop-color="#121A2A"/>
    </linearGradient>
    <linearGradient id="rootGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="480" rx="16" fill="url(#bg)"/>
  
  <text x="550" y="38" fill="#00F2FE" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="2" text-anchor="middle">CHRONOLEDGER CRYPTOGRAPHIC MERKLE TREE ARCHITECTURE</text>
  <text x="550" y="60" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">RFC 6962 Standard Tree Hash Formulation &amp; Zero-Knowledge Audit Path</text>

  <!-- Level 3: Merkle Root -->
  <g transform="translate(425, 95)">
    <rect width="250" height="60" rx="10" fill="url(#rootGrad)"/>
    <text x="125" y="26" fill="#0B0F19" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">MERKLE ROOT (R)</text>
    <text x="125" y="46" fill="#0B0F19" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">SHA256(0x01 || H12 || H34)</text>
  </g>

  <!-- Connecting Lines -->
  <line x1="480" y1="155" x2="310" y2="205" stroke="#00F2FE" stroke-width="2"/>
  <line x1="620" y1="155" x2="790" y2="205" stroke="#4FACFE" stroke-width="2"/>

  <!-- Level 2: Interior Nodes -->
  <g transform="translate(190, 205)">
    <rect width="240" height="50" rx="8" fill="url(#leafGrad)" stroke="#00F2FE" stroke-width="1.5"/>
    <text x="120" y="24" fill="#00F2FE" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Node H12</text>
    <text x="120" y="40" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="middle">SHA256(0x01 || H1 || H2)</text>
  </g>

  <g transform="translate(670, 205)">
    <rect width="240" height="50" rx="8" fill="url(#leafGrad)" stroke="#4FACFE" stroke-width="1.5"/>
    <text x="120" y="24" fill="#4FACFE" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Node H34</text>
    <text x="120" y="40" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="middle">SHA256(0x01 || H3 || H4)</text>
  </g>

  <!-- Connecting Lines to Leaves -->
  <line x1="250" y1="255" x2="160" y2="305" stroke="#00F2FE" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="370" y1="255" x2="400" y2="305" stroke="#00F2FE" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="730" y1="255" x2="700" y2="305" stroke="#4FACFE" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="850" y1="255" x2="940" y2="305" stroke="#4FACFE" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Level 1: Leaf Hashes -->
  <g transform="translate(60, 305)">
    <rect width="200" height="45" rx="6" fill="#1E293B" stroke="#334155"/>
    <text x="100" y="22" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Leaf H1 (Verified)</text>
    <text x="100" y="36" fill="#64748B" font-family="monospace" font-size="9" text-anchor="middle">SHA256(0x00 || D1)</text>
  </g>

  <g transform="translate(300, 305)">
    <rect width="200" height="45" rx="6" fill="#1E293B" stroke="#334155"/>
    <text x="100" y="22" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Leaf H2 (Proof Sibling)</text>
    <text x="100" y="36" fill="#64748B" font-family="monospace" font-size="9" text-anchor="middle">SHA256(0x00 || D2)</text>
  </g>

  <g transform="translate(600, 305)">
    <rect width="200" height="45" rx="6" fill="#1E293B" stroke="#334155"/>
    <text x="100" y="22" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Leaf H3</text>
    <text x="100" y="36" fill="#64748B" font-family="monospace" font-size="9" text-anchor="middle">SHA256(0x00 || D3)</text>
  </g>

  <g transform="translate(840, 305)">
    <rect width="200" height="45" rx="6" fill="#1E293B" stroke="#334155"/>
    <text x="100" y="22" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Leaf H4</text>
    <text x="100" y="36" fill="#64748B" font-family="monospace" font-size="9" text-anchor="middle">SHA256(0x00 || D4)</text>
  </g>

  <!-- Level 0: Raw Documents & Verification Certificate -->
  <g transform="translate(60, 385)">
    <rect width="980" height="65" rx="8" fill="#0F172A" stroke="#1E293B"/>
    <text x="30" y="30" fill="#10B981" font-family="system-ui, sans-serif" font-size="13" font-weight="700">✓ ZERO-KNOWLEDGE PROOF:</text>
    <text x="30" y="48" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Document D1 proves inclusion in Root R using sibling hash H2 and interior node H34 without exposing file contents.</text>
    <rect x="780" y="15" width="180" height="35" rx="6" fill="#00F2FE" opacity="0.15" stroke="#00F2FE"/>
    <text x="870" y="37" fill="#00F2FE" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Ed25519 Notary Signed</text>
  </g>
</svg>